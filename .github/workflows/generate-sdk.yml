name: Generate USPS SDK

on:
  workflow_dispatch:
    inputs:
      create_pr:
        description: "Open a PR if generated code changed"
        type: boolean
        default: true

permissions:
  contents: write
  pull-requests: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - run: go install github.com/oapi-codegen/oapi-codegen/v2/cmd/oapi-codegen@v2.5.0
      - name: Generate
        env:
          # CI expects cached specs or SPEC_LOCAL_DIR secret path; default uses .cache if present.
          FORCE_FETCH: "0"
        run: |
          if [[ -d .cache/specs ]] && ls .cache/specs/*.yml >/dev/null 2>&1; then
            bash generate.sh
          else
            echo "No cached specs in CI — skip regenerate (run locally with SPEC_DIR / SPEC_LOCAL_DIR)"
            exit 0
          fi
      - run: go mod tidy
      - run: go test ./... -count=1
      - id: diff
        run: |
          if git diff --quiet -- internal/generated go.mod go.sum usps/servers.gen.go; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - if: inputs.create_pr && steps.diff.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "chore: regenerate USPS v3 clients from OpenAPI"
          title: "chore: regenerate USPS v3 clients from OpenAPI"
          body: |
            Automated regeneration from USPS OpenAPI.

            - Official OpenAPI YAML is **not** committed.
            - Review generated diffs carefully before merge.
          branch: chore/regenerate-usps-sdk
          delete-branch: true
